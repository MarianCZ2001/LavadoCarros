<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <!-- Car body -->
  <path d="M 20 85 Q 60 50, 150 45 L 280 45 Q 330 50, 390 85" stroke="#00D9FF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Car windows -->
  <rect x="120" y="50" width="50" height="30" stroke="#00D9FF" stroke-width="3" fill="none" rx="3"/>
  <rect x="210" y="50" width="50" height="30" stroke="#00D9FF" stroke-width="3" fill="none" rx="3"/>
  
  <!-- Car bottom line -->
  <line x1="80" y1="85" x2="320" y2="85" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Front wheel -->
  <circle cx="130" cy="105" r="15" stroke="#00D9FF" stroke-width="3" fill="none"/>
  <circle cx="130" cy="105" r="8" stroke="#00D9FF" stroke-width="2" fill="none"/>
  
  <!-- Back wheel -->
  <circle cx="270" cy="105" r="15" stroke="#00D9FF" stroke-width="3" fill="none"/>
  <circle cx="270" cy="105" r="8" stroke="#00D9FF" stroke-width="2" fill="none"/>
  
  <!-- Headlight -->
  <circle cx="25" cy="80" r="6" fill="#00D9FF"/>
</svg>